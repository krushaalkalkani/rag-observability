# Seed golden set (Phase 2). Phase 3 grows this to 50-200 questions.
#
# Each answerable item has an `evidence` quote copied EXACTLY from the filing.
# `python eval/build_golden.py` finds every chunk that contains the quote and
# writes eval/golden_set.jsonl with `source_chunk_ids` filled in. Because ids
# are derived from the quote, the labels survive re-chunking.
#
# Questions are phrased the way a user would ask, NOT copied from the quote,
# so word-overlap (BM25) doesn't get an unfair advantage.

- question: How many people did Apple employ at the end of fiscal 2026?
