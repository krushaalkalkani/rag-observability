  evidence: headquarters is located in Cupertino, California
- question: What share of Apple's revenue is sold through resellers and carriers rather than directly?
  reference_answer: About 60% of total net sales came through indirect distribution channels.
  evidence: indirect distribution channels accounted for approximately 60% of total net sales

